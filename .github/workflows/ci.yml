name: Hamro Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # FIX: Removed cache-dependency-path — package-lock.json files
          # are generated on npm install, not committed to the repo

      # Backend
      - name: Install Backend deps
        working-directory: Backend
        run: npm install

      - name: Test Backend
        working-directory: Backend
        run: npm test --if-present

      # Frontend
      - name: Install Frontend deps
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build